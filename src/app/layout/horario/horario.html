<section class="visita">
  <div class="visita__copy">
    <p class="eyebrow eyebrow--vino">{{ 'horario.eyebrow' | t }}</p>
    <h2 class="visita__titulo display">{{ 'horario.planea' | t }}</h2>

    <p class="visita__direccion">{{ direccion }}</p>

    <a class="visita__wa" [href]="'https://wa.me/' + whatsapp"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M21 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.6-4.9A8.4 8.4 0 1 1 21 11.6Z"/>
      </svg>
      {{ 'horario.escribenos' | t }}
    </a>
  </div>

  <dl class="tabla">
    @for (f of filas; track f.dia) {
      <div class="tabla__fila">
        <dt class="tabla__dia">{{ f.dia | t }}</dt>
        <dd class="tabla__hora" [class.tabla__hora--cerrado]="f.claveHora">
          @if (f.claveHora) {
            {{ f.claveHora | t }}
          } @else {
            {{ f.hora }}
          }
        </dd>
      </div>
    }
  </dl>
</section>
