<section class="horario">
  <div class="horario__cuerpo contenedor">

    <span class="horario__icono" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none"
           stroke="currentColor" stroke-width="1.7">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5.2l3.2 2"/>
      </svg>
    </span>

    <p class="horario__ante">{{ 'horario.ante' | t }}</p>
    <h2 class="horario__titulo">{{ 'horario.titulo' | t }}</h2>

    <ul class="tabla">
      @for (f of franjas; track f.clave) {
        <li class="tabla__fila" [class.tabla__fila--cerrado]="f.cerrado">
          <span>{{ f.clave | t }}</span>
          <span>{{ f.cerrado ? ('horario.cerrado' | t) : f.valor }}</span>
        </li>
      }
    </ul>

    <a class="horario__wa" [href]="'https://wa.me/' + whatsapp" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
        <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.3A10 10 0 1 0 12 2Zm5.5 14.2c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.6-.1a11 11 0 0 1-5.4-4.7c-.4-.7-.7-1.5-.7-2.2 0-.8.4-1.5.7-1.7.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.4l.8 1.9c.1.2 0 .4-.1.5l-.4.5c-.1.1-.2.3-.1.5.4.8 1.5 2 2.6 2.5.2.1.4.1.5 0l.6-.7c.2-.2.3-.2.5-.1l1.8.9c.2.1.3.2.3.4s0 .7-.1 1Z"/>
      </svg>
      {{ 'horario.escribenos' | t }}
    </a>

  </div>
</section>
